---
- name: Add user in docker group
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true

- name: Change docker.sock permissions
  file:
    path: /var/run/docker.sock
    state: file
    mode: "0666"

- name: Create workdir
  become: yes
  file:
    path: /root/selenoid
    state: directory

- name: Create network for selenoid
  docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - selenoid1
    - selenoid2

